services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pagemint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pagemint_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-pagemint}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pagemint} -d $${POSTGRES_DB:-pagemint}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
